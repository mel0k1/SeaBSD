name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  shell-lint:
    name: ShellCheck (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck all shell scripts
        run: shellcheck -x $(git ls-files '*.sh')

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v17
        with:
          globs: '**/*.md'

  structure-check:
    name: Structure and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository structure check
        run: sh tools/structure-check.sh
      - name: Validate workflow YAML
        run: python3 -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml')); print('YAML OK')"

  # Static Linux probe binaries (tools/probes/*.c) must be compiled where a
  # Linux compiler is available. The FreeBSD matrix job downloads the artifact
  # and executes the probes through the linuxolator. Sanity-running on real
  # Linux first validates the probe itself (a FAIL here is a probe bug, not a
  # linuxolator bug).
  linux-probes:
    name: Build Linux probes (static x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile futex probe (static)
        run: |
          mkdir -p dist/probes
          cc -std=gnu11 -O2 -Wall -Wextra -static -o dist/probes/futex_stress \
            tools/probes/futex_stress.c -lpthread
          file dist/probes/futex_stress
      - name: Sanity-run the probe on real Linux
        run: |
          set +e
          dist/probes/futex_stress
          rc=$?
          echo "probe rc=$rc (0=pass, 77=all-skipped, 1=fail, 124=watchdog)"
          test "$rc" -eq 0 || test "$rc" -eq 77
      - name: Upload probe binaries
        uses: actions/upload-artifact@v4
        with:
          name: linux-probes
          path: dist/probes/futex_stress
          if-no-files-found: error

  # Stabilization phase: VM jobs are non-blocking (continue-on-error) while the
  # matrix results are being collected on real FreeBSD runners.
  # NOTE: do not `pkg install shellcheck` in the VM - the package no longer
  # exists in FreeBSD repositories; linting is covered by the Ubuntu job.
  freebsd-smoke:
    name: FreeBSD smoke test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Boot FreeBSD VM and run checks
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          release: '14.1'
          run: |
            set -e
            scripts=$(find . -name '*.sh' -not -path './.git/*')
            for f in $scripts; do
              sh -n "$f"
              echo "syntax ok: $f"
            done
            sh tools/structure-check.sh
            sh tools/linux-matrix.sh check
            sh tools/linux-matrix.sh list

  freebsd-linux-matrix:
    name: FreeBSD linuxolator matrix (base + futex)
    needs: linux-probes
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Download probe binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-probes
          path: probes
      - name: Boot FreeBSD VM, install pinned Linux base, run matrix
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          release: '14.1'
          prepare: |
            pkg install -y ca_root_nss
          run: |
            set -e
            kldload linux64 || true
            sysctl -n compat.linux.osrelease
            sh tools/fetch-linux-base.sh --dest /compat/linux
            mkdir -p /compat/linux/proc /compat/linux/sys
            kldload linprocfs || true
            kldload linsysfs || true
            mount -t linprocfs linproc /compat/linux/proc
            mount -t linsysfs linsys /compat/linux/sys
            rc_base=0; rc_futex=0
            sh tools/linux-matrix.sh check
            sh tools/linux-matrix.sh --only base --report dist/freebsd-matrix-report.yaml run || rc_base=$?
            mkdir -p /tmp/seabsd-probes
            cp probes/futex_stress /tmp/seabsd-probes/
            chmod +x /tmp/seabsd-probes/futex_stress
            SEABSD_PROBES_DIR=/tmp/seabsd-probes \
              sh tools/linux-matrix.sh --timeout 120 --only futex \
              --report dist/freebsd-futex-report.yaml run || rc_futex=$?
            echo "matrix rc=$rc_base futex rc=$rc_futex"
            echo '=== base matrix report ==='
            cat dist/freebsd-matrix-report.yaml
            echo '=== futex matrix report ==='
            cat dist/freebsd-futex-report.yaml
      - name: Upload matrix reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebsd-linux-matrix-report
          path: dist/*.yaml
          if-no-files-found: ignore

  package-source:
    name: Package source tarball
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source tarball
        run: |
          ver="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="seabsd-${ver}/" -o "seabsd-${ver}.tar.gz" HEAD
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: seabsd-source-${{ github.ref_name }}
          path: seabsd-*.tar.gz
